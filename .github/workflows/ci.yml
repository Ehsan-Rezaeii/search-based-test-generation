name: verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=search_based_test_generation --cov-report=term-missing --cov-report=xml
      - run: python experiments/smoke_test.py
      - run: python -m build
      - name: Clean wheel install and external import
        shell: bash
        run: |
          python -m venv /tmp/sbst-wheel
          /tmp/sbst-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sbst-wheel/bin/python -c "from search_based_test_generation.fixtures import threshold_gate; assert threshold_gate(12,-3)==3"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.python }}
          path: |
            coverage.xml
            dist/
