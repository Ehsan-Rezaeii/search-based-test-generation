[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-based-test-generation"
version = "0.1.0"
description = "An execution-audited six-fixture search-based testing study"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["metaheuristics-lab @ git+https://github.com/Ehsan-Rezaeii/metaheuristics-lab.git@6b4ef0fa3d72f608146f3dd7eabb84bf39fa896e"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1"]
plots = ["matplotlib>=3.8"]

[project.scripts]
sbst = "search_based_test_generation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["results/study/suites"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
